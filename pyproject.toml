[project]
name = "jev-tool-router"
version = "0.1.0"
description = "Experimental typed Jev tool routing for application-owned agent tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.6,<0.7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
lab = ["openai>=2.0,<3", "typer>=0.16,<1"]

[project.urls]
Repository = "https://github.com/esinocchi/jev-tool-router"
Issues = "https://github.com/esinocchi/jev-tool-router/issues"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "openai>=2.0,<3", "typer>=0.16,<1"]

[project.scripts]
jev-router = "jev_router.lab.entry:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: opt-in paid API integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
