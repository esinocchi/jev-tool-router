<svg xmlns="http://www.w3.org/2000/svg" width="624" height="378" viewBox="0 0 624 378" role="img" aria-labelledby="title description">
  <title id="title">Flat tools versus Jev filtering in one mock-agent run</title>
  <desc id="description">Both agents completed ten of ten synthetic tasks using the same Luna model. Mean latency was 2.575 seconds with all tools and 3.071 seconds with Jev filtering. Estimated cost was 0.002979 and 0.002786 dollars.</desc>
  <rect x="0.5" y="0.5" width="623" height="377" rx="4" fill="#fbfaf8" stroke="#dedbd6"/>

  <text x="28" y="39" fill="#706f6c" font-family="Geist Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.3">EXPERIMENT 02 / AGENT LOOP</text>
  <text x="28" y="73" fill="#1a1a1a" font-family="Geist, system-ui, sans-serif" font-size="20" font-weight="600">What happens when Jev filters first?</text>
  <text x="28" y="98" fill="#706f6c" font-family="Geist, system-ui, sans-serif" font-size="13">10 synthetic tasks · 16 tools · both agents completed 10/10</text>
  <line x1="28" y1="119.5" x2="596" y2="119.5" stroke="#dedbd6"/>

  <text x="28" y="149" fill="#706f6c" font-family="Geist Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.8">MEAN TASK LATENCY</text>
  <text x="28" y="177" fill="#706f6c" font-family="Geist, system-ui, sans-serif" font-size="14">Flat tools</text>
  <rect x="126" y="166" width="252" height="10" fill="#a8a5a0"/>
  <text x="596" y="177" text-anchor="end" fill="#1a1a1a" font-family="Geist Mono, ui-monospace, monospace" font-size="13">2.575 s</text>
  <text x="28" y="206" fill="#1a1a1a" font-family="Geist, system-ui, sans-serif" font-size="14">Jev filter</text>
  <rect x="126" y="195" width="300" height="10" fill="#1a1a1a"/>
  <text x="596" y="206" text-anchor="end" fill="#1a1a1a" font-family="Geist Mono, ui-monospace, monospace" font-size="13">3.071 s</text>
  <line x1="28" y1="226.5" x2="596" y2="226.5" stroke="#dedbd6"/>

  <text x="28" y="256" fill="#706f6c" font-family="Geist Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.8">ESTIMATED API COST / 10 TASKS</text>
  <text x="28" y="284" fill="#706f6c" font-family="Geist, system-ui, sans-serif" font-size="14">Flat tools</text>
  <rect x="126" y="273" width="300" height="10" fill="#a8a5a0"/>
  <text x="596" y="284" text-anchor="end" fill="#1a1a1a" font-family="Geist Mono, ui-monospace, monospace" font-size="13">$0.002979</text>
  <text x="28" y="313" fill="#1a1a1a" font-family="Geist, system-ui, sans-serif" font-size="14">Jev filter</text>
  <rect x="126" y="302" width="281" height="10" fill="#1a1a1a"/>
  <text x="596" y="313" text-anchor="end" fill="#1a1a1a" font-family="Geist Mono, ui-monospace, monospace" font-size="13">$0.002786</text>
  <line x1="28" y1="333.5" x2="596" y2="333.5" stroke="#dedbd6"/>
  <text x="28" y="358" fill="#706f6c" font-family="Geist, system-ui, sans-serif" font-size="12">One run · prices are estimates · routing and agent time included</text>
</svg>
